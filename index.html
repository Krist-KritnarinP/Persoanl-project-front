      rel="stylesheet"
    />
    <script>
      try {
        var t = localStorage.getItem("theme");
        if (t !== "liquid-glass" && t !== "liquid-glass-dark") {
          t = window.matchMedia("(prefers-color-scheme: dark)").matches
            ? "liquid-glass-dark"
            : "liquid-glass";
        }
        document.documentElement.dataset.theme = t;
        document.documentElement.style.colorScheme = t === "liquid-glass-dark" ? "dark" : "light";
      } catch (e) {}
    </script>
